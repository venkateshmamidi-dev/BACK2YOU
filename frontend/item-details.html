<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details — Back2You</title>
    <meta name="description" content="View detailed information about a lost or found item and its AI-generated matches.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .item-hero {
            background: var(--bg-white);
            border: 1px solid var(--border-gray);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .item-hero-image {
            width: 100%;
            max-height: 340px;
            object-fit: cover;
            background: var(--gray-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
        }
        .item-hero-image img { width: 100%; max-height: 340px; object-fit: cover; }
        .item-hero-body { padding: 1.75rem; }
        .item-type-badge { display: inline-block; margin-bottom: 0.75rem; }
        .item-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
        .item-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1.25rem; }
        .item-meta-cell { background: var(--gray-bg); border-radius: var(--radius-sm); padding: 0.75rem 1rem; }
        .item-meta-cell-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem; }
        .item-meta-cell-val { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); }
        @media (max-width: 600px) { .item-meta-grid { grid-template-columns: 1fr 1fr; } }
        .item-desc { margin-top: 1.25rem; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.7; }

        /* Match suggestions */
        .match-suggestion {
            display: flex;
            gap: 1rem;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-gray);
            cursor: pointer;
            transition: background 0.15s;
            border-radius: var(--radius-sm);
        }
        .match-suggestion:last-child { border-bottom: none; }
        .match-suggestion:hover { background: var(--gray-bg); padding-left: 0.5rem; }
        .match-sugg-img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); background: var(--gray-bg); border: 1px solid var(--border-gray); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .match-sugg-img img { width: 100%; height: 100%; object-fit: cover; }
        .match-sugg-content { flex: 1; min-width: 0; }
        .match-sugg-title { font-weight: 700; font-size: 0.9rem; }
        .match-sugg-meta { font-size: 0.78rem; color: var(--text-muted); }
        .score-pill { font-size: 0.82rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 9999px; flex-shrink: 0; }

        /* Claim section */
        .claim-section { margin-top: 1.5rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="nav-brand">
            <div class="nav-logo-mark">B</div>
            <div>Back2You <span class="nav-tagline-sub">Campus Lost &amp; Found</span></div>
        </a>
        <ul class="nav-links" id="nav-links-list">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="report-lost.html">Report Lost</a></li>
            <li><a href="report-found.html">Report Found</a></li>
            <li><a href="matches.html">Matches</a></li>
            <li><a href="claims.html">Claims</a></li>
            <li><a href="community.html">Community</a></li>
            <li id="nav-admin-link" style="display:none"><a href="admin.html">Admin</a></li>
        </ul>
        <div class="nav-actions">
            <div id="nav-auth-links" style="display:flex;gap:0.75rem;"><a href="login.html" class="btn btn-secondary btn-sm">Log In</a><a href="register.html" class="btn btn-primary btn-sm">Get Started</a></div>
            <div id="nav-user-links" style="display:none;gap:0.75rem;align-items:center;flex-direction:row;">
                <a href="notifications.html" class="notif-bell-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="notif-badge" id="notif-badge" style="display:none;">0</span></a>
                <a href="profile.html" class="user-menu-btn"><div class="avatar-circle" id="nav-avatar">U</div><span id="nav-user-name">User</span></a>
                <a href="#" id="logout-btn" class="btn btn-secondary btn-sm">Log Out</a>
            </div>
            <button class="mobile-menu-toggle" id="mobile-menu-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <div class="page-header-content">
            <div id="page-title">
                <h1>Item Details</h1>
                <p class="page-subtitle">Full report information and AI-generated matches</p>
            </div>
            <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>

<div class="page-content">
    <div class="container">
        <div class="dashboard-grid">
            <!-- Left: item detail -->
            <div class="dashboard-main" id="item-detail-main">
                <div class="loading-state" style="padding:3rem;">
                    <div class="loading-spinner"></div>
                    <p>Loading item...</p>
                </div>
            </div>

            <!-- Sidebar: matches + actions -->
            <div class="dashboard-sidebar">
                <div class="card" id="matches-sidebar">
                    <div class="card-header">
                        <h3 class="card-title">AI Matches</h3>
                        <a href="matches.html" class="card-link">View all</a>
                    </div>
                    <div class="card-body" id="item-matches-list">
                        <div class="loading-state"><div class="loading-spinner"></div></div>
                    </div>
                </div>

                <div class="card" id="actions-sidebar">
                    <div class="card-header"><h3 class="card-title">Actions</h3></div>
                    <div class="card-body" id="actions-list">
                        <div class="loading-state"><div class="loading-spinner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    const matchId = params.get("match");

    if (!itemId && !matchId) {
        document.getElementById("item-detail-main").innerHTML = `<div class="empty-state"><h4>No item selected</h4><p>Go back and select an item.</p><a href="dashboard.html" class="btn btn-primary btn-sm" style="margin-top:0.75rem;">Dashboard</a></div>`;
    } else {
        loadItem();
    }

    async function loadItem() {
        try {
            const item = await API.getItem(itemId || matchId);
            renderItem(item);
            loadItemMatches(item.id, item.type);
            renderActions(item);
        } catch (err) {
            document.getElementById("item-detail-main").innerHTML = `<div class="empty-state"><h4>Could not load item</h4><p>${err.message}</p></div>`;
        }
    }

    function renderItem(item) {
        const isLost = item.type === "LOST";
        const main = document.getElementById("item-detail-main");
        main.innerHTML = `
            <div class="item-hero">
                <div class="item-hero-image">
                    ${item.image_url ? `<img src="${item.image_url}" alt="${escapeHtml(item.title)}">` : `<div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:3rem;"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><span>No image uploaded</span></div>`}
                </div>
                <div class="item-hero-body">
                    <span class="badge ${isLost ? 'badge-error' : 'badge-success'} item-type-badge">${isLost ? "Lost Item" : "Found Item"}</span>
                    <span class="badge ${statusBadgeClass(item.status)}" style="margin-left:0.5rem;">${item.status}</span>
                    <h1 class="item-title">${escapeHtml(item.title)}</h1>
                    <p class="item-desc">${escapeHtml(item.description)}</p>
                    <div class="item-meta-grid">
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Category</div><div class="item-meta-cell-val">${escapeHtml(item.category)}</div></div>
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Color</div><div class="item-meta-cell-val">${escapeHtml(item.color || "—")}</div></div>
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Brand</div><div class="item-meta-cell-val">${escapeHtml(item.brand || "—")}</div></div>
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Location</div><div class="item-meta-cell-val">${escapeHtml(item.location_description || "—")}</div></div>
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Date</div><div class="item-meta-cell-val">${formatDate(item.date_occurred || item.reported_at)}</div></div>
                        <div class="item-meta-cell"><div class="item-meta-cell-label">Reported By</div><div class="item-meta-cell-val">${escapeHtml(item.reporter_name || "Anonymous")}</div></div>
                    </div>
                    ${item.reward_note ? `<div style="margin-top:1rem;padding:1rem;background:#FFFBEB;border-left:3px solid #F59E0B;border-radius:var(--radius-sm);font-size:0.88rem;color:#78350F;"><strong>Note from reporter:</strong> ${escapeHtml(item.reward_note)}</div>` : ""}
                </div>
            </div>`;
    }

    async function loadItemMatches(id, type) {
        const el = document.getElementById("item-matches-list");
        try {
            const matches = await API.getItemMatches(id);
            if (!matches.length) {
                el.innerHTML = `<p style="font-size:0.88rem;color:var(--text-muted);text-align:center;padding:1rem 0;">No AI matches found yet.</p>`;
                return;
            }
            el.innerHTML = matches.map(m => {
                const score = Math.round((m.confidence_score || 0) * 100);
                const color = score > 70 ? "#16A34A" : score > 40 ? "#2563EB" : "#F59E0B";
                const other = type === "LOST" ? m.found_item_title : m.lost_item_title;
                const otherImg = type === "LOST" ? m.found_item_image : m.lost_item_image;
                return `<div class="match-suggestion" onclick="window.location.href='matches.html'">
                    <div class="match-sugg-img">${otherImg ? `<img src="${otherImg}" alt="">` : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/></svg>`}</div>
                    <div class="match-sugg-content">
                        <div class="match-sugg-title">${escapeHtml(other || "Unknown")}</div>
                        <div class="match-sugg-meta">${m.found_item_category || ""}</div>
                    </div>
                    <span class="score-pill" style="background:${color}22;color:${color};">${score}%</span>
                </div>`;
            }).join("");
        } catch {
            el.innerHTML = `<p style="font-size:0.88rem;color:var(--text-muted);">Matches unavailable.</p>`;
        }
    }

    function renderActions(item) {
        const el = document.getElementById("actions-list");
        const user = Auth.getUser();
        const isOwner = user && item.reporter_id === user.id;
        const isLoggedIn = Auth.isLoggedIn();

        const actions = [];
        if (isLoggedIn && item.type === "FOUND" && !isOwner) {
            actions.push(`<a href="claims.html?item=${item.id}" class="btn btn-primary btn-block">Submit Ownership Claim</a>`);
        }
        if (isOwner) {
            actions.push(`<button class="btn btn-secondary btn-block" onclick="markClosed('${item.id}')">Close Report</button>`);
        }
        actions.push(`<a href="matches.html" class="btn btn-outline btn-block">Browse All Matches</a>`);
        actions.push(`<a href="report-lost.html" class="btn btn-outline btn-block">Report Another Item</a>`);

        el.innerHTML = actions.join("");
    }

    async function markClosed(id) {
        try {
            await API.updateItemStatus(id, "CLOSED");
            showToast("Report closed.", "success");
            setTimeout(() => window.location.href = "dashboard.html", 1000);
        } catch (err) {
            showToast(err.message || "Failed to close report.", "error");
        }
    }

    function statusBadgeClass(s) {
        const map = { ACTIVE: "badge-info", MATCHED: "badge-warning", CLAIMED: "badge-warning", RETURNED: "badge-success", CLOSED: "badge-neutral" };
        return map[s] || "badge-neutral";
    }
    function formatDate(d) { if (!d) return "—"; return new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" }); }
    function escapeHtml(s) { if (!s) return ""; return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>
</body>
</html>
